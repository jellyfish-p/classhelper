name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Build, test and smoke test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ClassHelper.sln

      - name: Verify formatting
        run: dotnet format ClassHelper.sln --verify-no-changes --no-restore

      - name: Build Release configuration
        run: dotnet build ClassHelper.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ClassHelper.sln --configuration Release --no-build

      - name: Run WPF smoke test
        run: dotnet run --project src/ClassHelper.App/ClassHelper.App.csproj --configuration Release --no-build -- --smoke-test
