name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag, for example v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    name: Publish Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          $semVerPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'

          if (-not ($env:REQUESTED_TAG -cmatch $semVerPattern)) {
            throw "Release tag '$env:REQUESTED_TAG' must be 'v' followed by a valid SemVer 2.0.0 version."
          }

          $isPrerelease = -not [string]::IsNullOrEmpty($Matches[4])
          "RELEASE_TAG=$env:REQUESTED_TAG" >> $env:GITHUB_ENV
          "VERSION=$($env:REQUESTED_TAG.Substring(1))" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ClassHelper.sln

      - name: Verify formatting
        run: dotnet format ClassHelper.sln --verify-no-changes --no-restore

      - name: Build Release configuration
        run: dotnet build ClassHelper.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ClassHelper.sln --configuration Release --no-build

      - name: Run WPF smoke test
        run: dotnet run --project src/ClassHelper.App/ClassHelper.App.csproj --configuration Release --no-build -- --smoke-test

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish src/ClassHelper.App/ClassHelper.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:Version=$env:VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Package application and checksum
        shell: pwsh
        run: |
          $archive = "artifacts/ClassHelper-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $archive -CompressionLevel Optimal

          $checksum = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumFile = "$archive.sha256"
          "$checksum  $(Split-Path -Path $archive -Leaf)" | Set-Content -Path $checksumFile -Encoding ascii

          "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumFile" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ClassHelper-${{ env.VERSION }}-win-x64
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $env:ARCHIVE_PATH $env:CHECKSUM_PATH --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload assets to GitHub Release '$env:RELEASE_TAG'."
            }

            $prereleaseFlag = "--prerelease=$env:IS_PRERELEASE"
            gh release edit $env:RELEASE_TAG $prereleaseFlag
          }
          else {
            $releaseArguments = @(
              "release", "create",
              $env:RELEASE_TAG,
              $env:ARCHIVE_PATH,
              $env:CHECKSUM_PATH,
              "--verify-tag",
              "--generate-notes",
              "--title", "ClassHelper $env:VERSION"
            )

            if ($env:IS_PRERELEASE -eq "true") {
              $releaseArguments += "--prerelease"
            }

            gh @releaseArguments
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release '$env:RELEASE_TAG'."
          }
